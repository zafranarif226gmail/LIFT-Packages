name: Build LIFT Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout LIFT Builder
        uses: actions/checkout@v4

      - name: Clone Termux Packages
        run: |
          git clone --depth 1 https://github.com/termux/termux-packages.git

      - name: Configure LIFT
        run: |
          cd termux-packages

          sed -i \
            -e 's/^TERMUX_APP__PACKAGE_NAME=.*/TERMUX_APP__PACKAGE_NAME="com.lift.terminal"/' \
            -e 's/^TERMUX__NAME=.*/TERMUX__NAME="LIFT"/' \
            scripts/properties.sh

          grep -E '^(TERMUX_APP__PACKAGE_NAME|TERMUX__NAME)=' scripts/properties.sh

      - name: Prepare download retries
        run: |
          cd termux-packages
          chmod +x scripts/run-docker.sh

          ./scripts/run-docker.sh bash -c 'cat > ~/.curlrc <<EOF
          retry = 10
          retry-all-errors
          retry-delay = 5
          connect-timeout = 30
          max-time = 300
          EOF
          cat ~/.curlrc'

      - name: Configure libgpg-error mirror
        run: |
          cd termux-packages

          FILE="packages/libgpg-error/build.sh"

          test -f "$FILE"

          sed -i \
            's#https://www.gnupg.org/ftp/gcrypt/libgpg-error/#https://mirrors.dotsrc.org/gcrypt/libgpg-error/#g' \
            "$FILE"

          grep 'TERMUX_PKG_SRCURL' "$FILE"

      - name: Configure libgcrypt mirror
        run: |
          cd termux-packages

          FILE="packages/libgcrypt/build.sh"

          test -f "$FILE"

          sed -i \
            's#https://www.gnupg.org/ftp/gcrypt/libgcrypt/#https://mirrors.dotsrc.org/gcrypt/libgcrypt/#g' \
            "$FILE"

          grep 'TERMUX_PKG_SRCURL' "$FILE"

      - name: Build ARM64 Bootstrap
        run: |
          cd termux-packages

          chmod +x scripts/run-docker.sh
          chmod +x scripts/build-bootstraps.sh

          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 -f

      - name: Collect Bootstrap Files
        run: |
          mkdir -p artifacts

          if [ ! -s termux-packages/bootstrap-aarch64.zip ]; then
            echo "Bootstrap ZIP tidak dijumpai!"
            find termux-packages -maxdepth 3 -name '*.zip' -print
            exit 1
          fi

          cp termux-packages/bootstrap-aarch64.zip artifacts/

          ls -lh artifacts/

      - name: Upload Bootstrap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIFT-Bootstrap-aarch64
          path: artifacts/bootstrap-aarch64.zip
          if-no-files-found: error
