
name: Build LIFT Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout LIFT Builder
        uses: actions/checkout@v4

      - name: Clone Termux Packages
        run: |
          git clone --depth 1 https://github.com/termux/termux-packages.git

      - name: Configure LIFT
        run: |
          cd termux-packages
          sed -i \
            -e 's/^TERMUX_APP__PACKAGE_NAME=.*/TERMUX_APP__PACKAGE_NAME="com.lift.terminal"/' \
            -e 's/^TERMUX__NAME=.*/TERMUX__NAME="LIFT"/' \
            scripts/properties.sh

      - name: Prepare download retries
        run: |
          cd termux-packages
          chmod +x scripts/run-docker.sh
          ./scripts/run-docker.sh bash -c 'cat > ~/.curlrc <<EOF
          retry = 10
          retry-all-errors
          retry-delay = 5
          connect-timeout = 30
          max-time = 300
          EOF'

      - name: Configure libgpg-error mirror
        run: |
          cd termux-packages
          FILE="packages/libgpg-error/build.sh"
          test -f "$FILE"
          sed -i 's#https://www.gnupg.org/ftp/gcrypt/libgpg-error/#https://mirrors.dotsrc.org/gcrypt/libgpg-error/#g' "$FILE"

      - name: Configure libgcrypt mirror
        run: |
          cd termux-packages
          FILE="packages/libgcrypt/build.sh"
          test -f "$FILE"
          sed -i 's#https://www.gnupg.org/ftp/gcrypt/libgcrypt/#https://mirrors.dotsrc.org/gcrypt/libgcrypt/#g' "$FILE"

      - name: Build ARM64 Bootstrap
        run: |
          cd termux-packages
          chmod +x scripts/run-docker.sh scripts/build-bootstraps.sh
          ./scripts/run-docker.sh bash -lc 'cat > ~/.curlrc <<EOF
          retry = 10
          retry-all-errors
          retry-delay = 5
          connect-timeout = 30
          max-time = 300
          EOF
          ./scripts/build-bootstraps.sh --architecture
          s aarch64'
